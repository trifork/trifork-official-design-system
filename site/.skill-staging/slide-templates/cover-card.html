<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: cover-card</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template cover-card">
    <div class="slide cover-card" data-template-id="cover-card" data-layout-id="cover-card"><div class="slide-inner">
          <div class="photo-card" data-om-raster data-slot="photo" data-offline-fallback="Large photography is hosted only. If this image cannot load, keep the ink card and overlay.">
            <img src="https://brand.trifork.com/system/assets/imagery/trifork-people-1.jpg" alt="" onerror="this.style.display='none'">
            <div class="overlay" aria-hidden="true"></div>
            <div class="card-mark" data-slot="logo"><img src="../logo/Trifork_logo_neg_RGB.svg" alt="Trifork"></div>
            <h1 data-slot="title">Banking infrastructure that holds.</h1>
          </div>
          <div class="lower-left" data-slot="deck"><span>Capital markets</span><span class="sep">/</span><span>2025</span></div>
          <p class="lower-right" data-slot="summary">How we re-platformed Nordic Bank's settlement engine across twelve currencies, fourteen months from kickoff, without a single missed settlement window.</p>
        </div></div>
  </main>
</body>
</html>
