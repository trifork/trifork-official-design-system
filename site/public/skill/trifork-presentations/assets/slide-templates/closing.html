<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: closing</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template closing">
    <div class="slide closing on-dark" data-template-id="closing" data-layout-id="closing"><div class="slide-inner">
          <div class="photo-bg" data-slot="photo" data-offline-fallback="Large photography is hosted only. If this image cannot load, keep the layout and use the ink or light background."><img src="https://brand.trifork.com/system/assets/imagery/trifork-aarhus-2.jpg" alt="" onerror="this.style.display='none'"><div class="overlay" aria-hidden="true"></div></div>
          <h1 data-slot="title">Thank you.</h1>
          <div class="person" data-slot="contact">
            <div class="role" data-slot="role">PARTNER</div>
            <div class="name" data-slot="name">Anna Bjerg</div>
            <div class="contact"><span>anna.bjerg@trifork.com</span><span>+45 12 34 56 78</span></div>
          </div>
          <div class="s-logo" data-slot="logo"><img src="../logo/Trifork_logo_neg_RGB.svg" alt="Trifork"></div>
        </div></div>
  </main>
</body>
</html>
