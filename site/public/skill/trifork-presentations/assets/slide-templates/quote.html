<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: quote</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template quote">
    <div class="slide quote-slide is-long" data-template-id="quote" data-layout-id="quote"><div class="slide-inner">
          <div class="s-label" data-slot="label">CUSTOMER VOICE</div>
          <div class="quote-block" data-slot="quote"><q>“Trifork's team understood our regulatory environment from the first workshop. We shipped the first release a quarter ahead of plan, and the platform now belongs to us, not to a vendor.”</q></div>
          <div class="attr" data-slot="attribution">
            <div class="portrait" data-om-raster data-slot="portrait"><img src="https://brand.trifork.com/system/assets/imagery/trifork-people-1.jpg" alt="" onerror="this.style.display='none'"></div>
            <div class="who"><b data-slot="name">Mette Lindholm</b><span data-slot="role">Head of Platform, Nordic Bank</span></div>
          </div>
          <div class="s-foot" data-slot="footer"><span class="page">12</span><span class="sep">/</span><span class="deck">Capital markets, 2025</span></div><div class="s-logo" data-slot="logo"><img src="../logo/Trifork_logo_RGB.svg" alt="Trifork"></div>
        </div></div>
  </main>
</body>
</html>
