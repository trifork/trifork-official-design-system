<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: separator-photo</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template separator-photo">
    <div class="slide separator on-dark" data-template-id="separator-photo" data-layout-id="separator-photo"><div class="slide-inner">
          <div class="photo-bg" data-slot="photo" data-offline-fallback="Large photography is hosted only. If this image cannot load, keep the layout and use the ink or light background."><img src="https://brand.trifork.com/system/assets/imagery/trifork-aarhus-1.jpg" alt="" onerror="this.style.display='none'"><div class="overlay" aria-hidden="true"></div></div>
          <div class="label-block" data-slot="label">SECTION</div>
          <h1 data-slot="title">Outcomes.</h1>
          <p class="lede" data-slot="lede">What we measured, and what we would do differently next time.</p>
          <div class="s-foot" data-slot="footer"><span class="page">03</span><span class="sep">/</span><span class="deck">Capital markets, 2025</span></div><div class="s-logo" data-slot="logo"><img src="../logo/Trifork_logo_neg_RGB.svg" alt="Trifork"></div>
        </div></div>
  </main>
</body>
</html>
