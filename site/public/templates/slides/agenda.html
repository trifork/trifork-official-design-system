<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: agenda</title>
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template agenda">
    <div class="slide agenda" data-template-id="agenda" data-layout-id="agenda"><div class="slide-inner">
          <div class="s-label" data-slot="label">AGENDA</div>
          <h2 data-slot="title">What we'll cover.</h2>
          <ol data-slot="agendaItems">
            <li><b>01</b><span>Where we started, the legacy settlement engine</span></li><li><b>02</b><span>Architecture: distributed by design</span></li><li><b>03</b><span>Migration: the four-week production slice</span></li><li><b>04</b><span>Operating model and handover</span></li><li><b>05</b><span>Outcomes and what we would do differently</span></li>
          </ol>
          <div class="s-foot" data-slot="footer"><span class="page">04</span><span class="sep">/</span><span class="deck">Capital markets, 2025</span></div><div class="s-logo" data-slot="logo"><img src="https://brand.trifork.com/system/assets/logo/Trifork_logo_RGB.svg" alt="Trifork"></div>
        </div></div>
  </main>
</body>
</html>
