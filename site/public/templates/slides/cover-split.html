<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Trifork slide template: cover-split</title>
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="trifork-slide.css">
</head>
<body class="slide-template-document">
  <main class="slide-kit-page" aria-label="Trifork slide template cover-split">
    <div class="slide cover-split" data-template-id="cover-split" data-layout-id="cover-split"><div class="slide-inner">
          <div class="s-logo" data-slot="logo"><img src="https://brand.trifork.com/system/assets/logo/Trifork_logo_RGB.svg" alt="Trifork"></div>
          <div class="left-col">
            <div class="label-block" data-slot="label">CAPITAL MARKETS</div>
            <h1 data-slot="title">Banking infrastructure that holds.</h1>
            <p class="lede" data-slot="lede">How we re-platformed Nordic Bank's settlement engine, fourteen months from kickoff, without a single missed window.</p>
          </div>
          <div class="image-card" data-slot="photo" data-offline-fallback="Large photography is hosted only. If this image cannot load, keep the layout and use the ink or light background."><img src="https://brand.trifork.com/system/assets/imagery/trifork-aarhus-4.jpg" alt="" onerror="this.style.display='none'"></div>
          <div class="lower-left" data-slot="deck"><span>Capital markets</span><span class="sep">/</span><span>2025</span></div>
        </div></div>
  </main>
</body>
</html>
